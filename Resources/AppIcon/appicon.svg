<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456">
	<!-- Белый фон -->
	<rect width="456" height="456" rx="68" fill="#FFFFFF"/>

	<!-- Тонкая рамка -->
	<rect x="2" y="2" width="452" height="452" rx="66" fill="none" stroke="#E5E7EB" stroke-width="4"/>

	<!-- Красная полоса (символизирует красный цвет бренда) -->
	<rect x="0" y="0" width="456" height="12" fill="#E31E24"/>

	<!-- RBS Group текст -->
	<text x="228" y="260" font-family="Arial,Helvetica,sans-serif" font-size="120" font-weight="900" fill="#E31E24" text-anchor="middle" letter-spacing="-2">RBS</text>

	<!-- Group текст -->
	<text x="228" y="340" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="400" fill="#111827" text-anchor="middle" letter-spacing="4">GROUP</text>

	<!-- Красная полоса снизу -->
	<rect x="0" y="444" width="456" height="12" fill="#E31E24"/>
</svg>